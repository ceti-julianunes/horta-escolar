<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz da Horta Escolar</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, serif;
      background: #f5f9f0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .quiz-card {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      border: 2.5px solid #1a5c2a;
      border-radius: 16px;
      overflow: hidden;
    }

    .quiz-header {
      background: #1a5c2a;
      color: #ffffff;
      padding: 22px 20px;
      text-align: center;
    }

    .quiz-header h1 {
      font-size: 24px;
    }

    .quiz-header p {
      margin-top: 6px;
      color: #a8d8a8;
      font-size: 13px;
      font-style: italic;
    }

    .quiz-body {
      padding: 20px;
    }

    .back-button {
      display: inline-block;
      background: #f0f7ec;
      color: #1a5c2a;
      border: 1.5px solid #1a5c2a;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 18px;
      font-size: 12px;
      font-weight: bold;
      text-decoration: none;
    }

    .progress {
      color: #5f5e5a;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .question {
      color: #1a5c2a;
      font-size: 18px;
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .option {
      width: 100%;
      background: #f0f7ec;
      color: #2c2c2a;
      border: 1.5px solid #c0dd97;
      border-radius: 10px;
      padding: 12px;
      font-family: Georgia, serif;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }

    .option:hover {
      border-color: #1a5c2a;
      background: #e5f2dc;
    }

    .option.correct {
      background: #d8f3dc;
      border-color: #1a5c2a;
      color: #145522;
    }

    .option.wrong {
      background: #f8d7da;
      border-color: #a52a2a;
      color: #7d1d1d;
    }

    .option:disabled {
      cursor: default;
    }

    .feedback {
      min-height: 24px;
      margin-top: 14px;
      font-size: 13px;
      font-weight: bold;
    }

    .next-button {
      display: none;
      width: 100%;
      background: #d4a017;
      color: #3f2a00;
      border: none;
      border-radius: 10px;
      padding: 11px;
      margin-top: 12px;
      font-family: Georgia, serif;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      display: none;
      text-align: center;
    }

    .result h2 {
      color: #1a5c2a;
      margin-bottom: 12px;
    }

    .score {
      color: #d4a017;
      font-size: 32px;
      font-weight: bold;
      margin: 14px 0;
    }

    .restart-button {
      background: #1a5c2a;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-family: Georgia, serif;
      font-weight: bold;
      cursor: pointer;
    }

    .footer {
      background: #1a5c2a;
      color: #a8d8a8;
      padding: 10px;
      text-align: center;
      font-size: 11px;
      font-style: italic;
    }
  </style>
</head>

<body>

  <main class="quiz-card">
    <header class="quiz-header">
      <h1>🌱 Quiz da Horta</h1>
      <p>Teste seus conhecimentos sobre as plantas</p>
    </header>

    <div class="quiz-body">
      <a href="index.html" class="back-button">
        ← Voltar para a lista de plantas
      </a>

      <section id="quiz-area">
        <div class="progress" id="progress"></div>
        <h2 class="question" id="question"></h2>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback" aria-live="polite"></div>

        <button
          type="button"
          class="next-button"
          id="next-button"
        >
          Próxima pergunta →
        </button>
      </section>

      <section class="result" id="result">
        <h2>Quiz concluído!</h2>
        <p>Sua pontuação foi:</p>
        <div class="score" id="score"></div>
        <p id="result-message"></p>

        <button
          type="button"
          class="restart-button"
          id="restart-button"
        >
          Jogar novamente
        </button>
      </section>
    </div>

    <footer class="footer">
      Projeto Conexão Sustentável · Horta Escolar Interativa
    </footer>
  </main>

  <script>
    const questions = [
      {
        question: "Qual parte do açafrão é utilizada?",
        options: ["Rizoma", "Fruto", "Folha"],
        answer: 0
      },
      {
        question: "Qual planta é conhecida por possuir muita vitamina C?",
        options: ["Boldo", "Acerola", "Mastruz"],
        answer: 1
      },
      {
        question: "Qual destas plantas é uma raiz tuberosa?",
        options: ["Tomate", "Beterraba", "Cebolinha"],
        answer: 1
      },
      {
        question: "Qual destas plantas é considerada medicinal?",
        options: ["Boldo", "Pimentão", "Tomate"],
        answer: 0
      },
      {
        question: "Qual destas plantas é um fruto cítrico?",
        options: ["Limão", "Coentro", "Malva-do-reino"],
        answer: 0
      },
      {
        question: "Qual é o nome científico da cebolinha?",
        options: [
          "Allium fistulosum L.",
          "Citrus limon",
          "Curcuma longa L."
        ],
        answer: 0
      },
      {
        question: "Qual planta é utilizada como tempero e corante natural?",
        options: ["Açafrão", "Acerola", "Beterraba"],
        answer: 0
      },
      {
        question: "Qual destas plantas é uma hortaliça folhosa e condimentar?",
        options: ["Limão", "Coentro", "Tomate"],
        answer: 1
      }
    ];

    let currentQuestion = 0;
    let points = 0;
    let answered = false;

    const progress = document.getElementById("progress");
    const questionElement = document.getElementById("question");
    const optionsElement = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next-button");
    const quizArea = document.getElementById("quiz-area");
    const result = document.getElementById("result");
    const score = document.getElementById("score");
    const resultMessage = document.getElementById("result-message");
    const restartButton = document.getElementById("restart-button");

    function showQuestion() {
      answered = false;
      feedback.textContent = "";
      nextButton.style.display = "none";
      optionsElement.innerHTML = "";

      const current = questions[currentQuestion];

      progress.textContent =
        `Pergunta ${currentQuestion + 1} de ${questions.length}`;

      questionElement.textContent = current.question;

      current.options.forEach((option, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "option";
        button.textContent = option;

        button.addEventListener("click", () => {
          checkAnswer(index, button);
        });

        optionsElement.appendChild(button);
      });
    }

    function checkAnswer(selectedIndex, selectedButton) {
      if (answered) return;

      answered = true;

      const current = questions[currentQuestion];
      const optionButtons =
        document.querySelectorAll(".option");

      optionButtons.forEach(button => {
        button.disabled = true;
      });

      if (selectedIndex === current.answer) {
        selectedButton.classList.add("correct");
        feedback.textContent = "✅ Resposta correta!";
        feedback.style.color = "#1a5c2a";
        points++;
      } else {
        selectedButton.classList.add("wrong");
        optionButtons[current.answer].classList.add("correct");
        feedback.textContent = "❌ Resposta incorreta.";
        feedback.style.color = "#a52a2a";
      }

      nextButton.style.display = "block";

      if (currentQuestion === questions.length - 1) {
        nextButton.textContent = "Ver resultado";
      } else {
        nextButton.textContent = "Próxima pergunta →";
      }
    }

    function showResult() {
      quizArea.style.display = "none";
      result.style.display = "block";

      score.textContent = `${points} de ${questions.length}`;

      if (points === questions.length) {
        resultMessage.textContent =
          "Excelente! Você conhece muito bem a nossa horta.";
      } else if (points >= questions.length / 2) {
        resultMessage.textContent =
          "Muito bem! Continue conhecendo as plantas.";
      } else {
        resultMessage.textContent =
          "Visite novamente as fichas e tente mais uma vez.";
      }
    }

    nextButton.addEventListener("click", () => {
      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    });

    restartButton.addEventListener("click", () => {
      currentQuestion = 0;
      points = 0;
      result.style.display = "none";
      quizArea.style.display = "block";
      showQuestion();
    });

    showQuestion();
  </script>

</body>
</html>
